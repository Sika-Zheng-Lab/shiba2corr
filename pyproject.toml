[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiba2corr"
version = "1.0.0"
description = "Weighted dPSI correlation analysis for alternative splicing events quantified by Shiba"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Naoto Kubota" },
    { name = "Sika Zheng" },
]
keywords = ["bioinformatics", "splicing", "shiba", "correlation", "dPSI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "matplotlib",
    "seaborn",
    "matplotlib-venn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "build",
    "twine",
]

[project.scripts]
shiba2corr = "shiba2corr.main:main"

[project.urls]
Homepage = "https://github.com/Sika-Zheng-Lab/shiba2corr"
Repository = "https://github.com/Sika-Zheng-Lab/shiba2corr"
Issues = "https://github.com/Sika-Zheng-Lab/shiba2corr/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["shiba2corr"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

name: Update Version

on:
  push:
    branches:
      - develop
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Read and validate version
        id: version
        run: |
          NEW_VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$NEW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION: $NEW_VERSION" >&2
            exit 1
          fi
          echo "tag=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "python=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Synchronize version fields
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag }}
          PYTHON_VERSION: ${{ steps.version.outputs.python }}
        run: |
          sed -i -E "s/v[0-9]+\.[0-9]+\.[0-9]+/$TAG_VERSION/g" README.md
          sed -i -E "s/__version__ = \"v[0-9]+\.[0-9]+\.[0-9]+\"/__version__ = \"$TAG_VERSION\"/" src/shiba2corr/__init__.py
          sed -i -E "s/version=\"v[0-9]+\.[0-9]+\.[0-9]+\"/version=\"$TAG_VERSION\"/" docker/Dockerfile
          sed -i -E "s/v[0-9]+\.[0-9]+\.[0-9]+/$TAG_VERSION/g" .github/ISSUE_TEMPLATE/*.yaml
          sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"$PYTHON_VERSION\"/" pyproject.toml
          sed -i -E "s/^version: v[0-9]+\.[0-9]+\.[0-9]+/version: $TAG_VERSION/" CITATION.cff

      - name: Commit synchronized versions
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag }}
        run: |
          if git diff --quiet; then
            echo "All version fields are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/shiba2corr/__init__.py docker/Dockerfile \
            .github/ISSUE_TEMPLATE/*.yaml pyproject.toml CITATION.cff
          git commit -m "actions: Ready for $TAG_VERSION"
          git push origin HEAD:develop
